name: Temporary Regenerate Convert Manifest

on:
  push:
    branches:
      - upstream-2026-09-strategy-doctrine

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-2026-09-strategy-doctrine
          fetch-depth: 0

      - name: Regenerate conversion manifest
        run: bash scripts/test-convert-outputs.sh --update

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- scripts/convert-outputs.sha256; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/convert-outputs.sha256
          git commit -m "Regenerate converted-output manifest"
          git push origin HEAD:upstream-2026-09-strategy-doctrine
