name: Check Tools Consistency

# Runs on every PR (no path filter on purpose): a new or renamed tool must trip
# this check even when nobody touched tools.json or the install/convert scripts.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tools:
    name: tools.json is the single source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install --require-hashes --no-deps -r .github/requirements/validation.txt

      - name: Validate tool registry and implementation coverage
        run: |
          chmod +x scripts/check-tools.sh
          ./scripts/check-tools.sh

      - name: Validate OpenClaw provenance verifier
        run: python3 scripts/test-openclaw-import-provenance.py

      - name: Validate Kimi current agent contract
        run: python3 scripts/test-kimi-adapter.py

      - name: Static shell analysis (errors only)
        run: shellcheck -x -S error scripts/*.sh

      - name: Validate generated Hermes plugin
        run: python3 scripts/check-hermes-plugin.py

      - name: Validate Hermes lifecycle behavior from a clean build
        run: python3 scripts/test-hermes-plugin.py

      - name: Validate incremental conversion state and pruning
        run: python3 scripts/test-incremental-conversion.py

      - name: Validate converted YAML frontmatter
        run: bash scripts/test-convert-frontmatter.sh

      - name: Reject colliding agent slugs before conversion
        run: bash scripts/test-convert-slug-collisions.sh

      - name: Refuse symlinked conversion output directories
        run: bash scripts/test-convert-symlink-output.sh

      - name: Validate converted outputs (round-trip, strict parse, counts, drift)
        run: bash scripts/test-convert-outputs.sh

      - name: Parse indented code fences like lib.sh in the outputs eval
        run: bash scripts/test-convert-fence-model.sh

      - name: Expose parallel converter failures and clean their buffers
        run: bash scripts/test-convert-parallel-failure.sh

      - name: Reject nested and unclosed fences; accept indented closers
        run: |
          bash scripts/test-lint-fences.sh
          bash scripts/test-frontmatter-closing.sh

      - name: Validate host acceptance records (evidence cannot outrun its method)
        run: python3 scripts/test-host-acceptance.py

      - name: Validate agent selection (install.sh --agent / --agents-file)
        run: bash scripts/test-agent-selection.sh

      - name: Validate generated catalog (CATALOG.md)
        run: python3 scripts/build-catalog.py --check
