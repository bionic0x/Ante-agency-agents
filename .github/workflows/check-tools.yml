name: Check Tools Consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tools:
    name: tools.json is the single source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-validation.txt

      - name: Generate catalog blob for API commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-catalog.py
          python3 - <<'PY'
          import json, os, urllib.request
          content = open('CATALOG.md', encoding='utf-8').read()
          payload = json.dumps({'content': content, 'encoding': 'utf-8'}).encode('utf-8')
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          print('CATALOG_BLOB_SHA=' + data['sha'])
          PY
          exit 1
