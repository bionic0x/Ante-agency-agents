name: Check Tools Consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tools:
    name: tools.json is the single source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-validation.txt

      - name: Commit generated conversion manifest for sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          out="$RUNNER_TEMP/convert-out"
          mkdir -p "$out"
          bash scripts/convert.sh --tool all --parallel --jobs 4 --out "$out" >/dev/null
          bash scripts/test-convert-outputs.sh --out="$out" --update
          git status --short
          if git diff --quiet -- scripts/convert-outputs.sha256; then
            echo 'convert-outputs.sha256 already current'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/convert-outputs.sha256
          git commit -m 'test(sync): update converted output manifest'
          tmp_ref="tmp/convert-output-manifest-pr34"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${tmp_ref}"
          exit 1
