name: Check Runbooks Consistency

# Runs on every PR (no path filter on purpose): renaming or removing an agent
# must trip this check even when nobody touched strategy/runbooks.json, since a
# dangling roster slug breaks the app's one-click team deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-runbooks:
    name: runbook rosters reference real agent slugs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-validation.txt

      - name: Validate runbook rosters
        run: |
          chmod +x scripts/check-runbooks.sh
          ./scripts/check-runbooks.sh

      - name: Validate termination contract failure cases
        run: python3 scripts/test-runbook-contracts.py

      - name: Preserve canonical epistemic states in handoffs
        run: python3 scripts/check-strategy-vocabulary.py

      - name: Validate NEXUS instance replay and evaluation contracts
        run: |
          python3 scripts/test-nexus-instance.py
          python3 scripts/test-nexus-evaluation.py
          python3 scripts/nexus-instance.py validate examples/nexus/strategic-decision.instance.json

      - name: Validate vector coverage and execution routing
        run: python3 scripts/test-nexus-routing.py

      - name: Keep HTP Gate 0 handoffs single-network and non-executing
        run: |
          python3 scripts/check-htp-gate0.py
          python3 scripts/test-htp-gate0.py
