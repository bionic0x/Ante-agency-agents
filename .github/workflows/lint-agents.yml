name: Lint Agent Files

on:
  pull_request:
    paths:
      - "academic/**"
      - "design/**"
      - "engineering/**"
      - "finance/**"
      - "game-development/**"
      - "gis/**"
      - "healthcare/**"
      - "marketing/**"
      - "mispriced-cmo/**"
      - "paid-media/**"
      - "sales/**"
      - "security/**"
      - "product/**"
      - "project-management/**"
      - "research/**"
      - "testing/**"
      - "support/**"
      - "spatial-computing/**"
      - "specialized/**"
      - "divisions.json"
      - "scripts/lib.sh"
      - "scripts/lint-agents.sh"
      - "scripts/registry.py"
      - "scripts/list-changed-agent-files.py"
      - "scripts/test-changed-agent-files.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate agent frontmatter and structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Test changed-agent discovery
        run: python3 scripts/test-changed-agent-files.py

      - name: Get changed agent and lint-infrastructure files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD | \
            python3 scripts/list-changed-agent-files.py)
          INFRA=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- \
            divisions.json scripts/lib.sh scripts/lint-agents.sh scripts/registry.py \
            scripts/list-changed-agent-files.py)
          {
            echo "files<<ENDOFLIST"
            echo "$FILES"
            echo "ENDOFLIST"
            if [ -n "$INFRA" ]; then
              echo "full=true"
            else
              echo "full=false"
            fi
          } >> "$GITHUB_OUTPUT"
          if [ -n "$INFRA" ]; then
            echo "Lint infrastructure changed; full roster lint required:"
            echo "$INFRA"
          elif [ -n "$FILES" ]; then
            echo "Changed agent files:"
            echo "$FILES"
          else
            echo "No agent files changed."
          fi

      - name: Run agent linter
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          FULL_LINT: ${{ steps.changed.outputs.full }}
        run: |
          chmod +x scripts/lint-agents.sh
          if [ "$FULL_LINT" = "true" ]; then
            ./scripts/lint-agents.sh
          else
            ./scripts/lint-agents.sh $CHANGED_FILES
          fi

      - name: Check agent originality
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/check-agent-originality.sh
          ./scripts/check-agent-originality.sh $CHANGED_FILES
