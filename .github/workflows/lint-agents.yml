name: Lint Agent Files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate agent frontmatter and structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install --require-hashes --no-deps -r .github/requirements/validation.txt

      - name: Test changed-agent discovery
        run: python3 scripts/test-changed-agent-files.py

      - name: Test privilege metadata parser
        run: python3 scripts/test-agent-privileges.py

      - name: Test capability observations and scoped profiles
        run: python3 scripts/test-agent-capabilities.py

      - name: Validate canonical agent tool privileges
        run: python3 scripts/check-agent-privileges.py --inventory

      - name: Get changed agent and lint-infrastructure files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR origin/"$BASE_REF"...HEAD | \
            python3 scripts/list-changed-agent-files.py)
          INFRA=$(git diff --name-only --diff-filter=ACMR origin/"$BASE_REF"...HEAD -- \
            divisions.json scripts/lib.sh scripts/lint-agents.sh scripts/registry.py \
            scripts/list-changed-agent-files.py scripts/agent-tools.json \
            scripts/check-agent-privileges.py)
          {
            echo "files<<ENDOFLIST"
            echo "$FILES"
            echo "ENDOFLIST"
            if [ -n "$INFRA" ]; then
              echo "full=true"
            else
              echo "full=false"
            fi
          } >> "$GITHUB_OUTPUT"
          if [ -n "$INFRA" ]; then
            echo "Lint infrastructure changed; full roster lint required:"
            echo "$INFRA"
          elif [ -n "$FILES" ]; then
            echo "Changed agent files:"
            echo "$FILES"
          else
            echo "No agent files changed."
          fi

      - name: Validate security engagement contract
        run: |
          python3 scripts/check-security-engagement.py
          python3 scripts/test-security-engagement.py

      - name: Run agent linter
        if: steps.changed.outputs.full == 'true' || steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          FULL_LINT: ${{ steps.changed.outputs.full }}
        run: |
          chmod +x scripts/lint-agents.sh
          if [ "$FULL_LINT" = "true" ]; then
            ./scripts/lint-agents.sh
          else
            ./scripts/lint-agents.sh $CHANGED_FILES
          fi

      - name: Check agent originality
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/check-agent-originality.sh
          ./scripts/check-agent-originality.sh $CHANGED_FILES

  lint-all:
    name: Whole roster, when the linter changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job above lints the agents a PR touched, which is the right scope for
    # an agent PR and the wrong one for a rule change: a new rule has to run
    # against every agent before it lands, or it either breaks a division nobody
    # edited or quietly does nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Did the linter or the color map change?
        id: rules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          RULES="scripts/lint-agents.sh scripts/convert.sh scripts/lib.sh"
          if [ -n "$BASE_REF" ]; then
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          else
            # Push events do not define github.base_ref. Diff against first parent.
            DIFF_RANGE="HEAD^...HEAD"
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$DIFF_RANGE" -- $RULES)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Linting the whole roster because these changed:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Linter unchanged - the changed-files job is the right scope here."
          fi

      - name: Lint every agent in the roster
        if: steps.rules.outputs.changed == 'true'
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh

      - name: Reject folded frontmatter fixtures
        if: steps.rules.outputs.changed == 'true'
        run: bash scripts/test-folded-frontmatter.sh
