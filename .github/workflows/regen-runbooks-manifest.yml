name: Regenerate Runbooks Manifest

on:
  push:
    branches:
      - doctrine/complete-termination-contracts

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: doctrine/complete-termination-contracts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Regenerate canonical conversion manifest
        run: bash scripts/test-convert-outputs.sh --update
      - name: Commit manifest only if changed
        shell: bash
        run: |
          if git diff --quiet -- scripts/convert-outputs.sha256; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/convert-outputs.sha256
          git commit -m 'chore: refresh runbooks contract fingerprint'
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:doctrine/complete-termination-contracts
