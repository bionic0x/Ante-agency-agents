name: Sync generated artifacts (temporary)
on:
  push:
    branches: [sync/upstream-2026-10-08]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Rebuild manifests from combined sources
        run: |
          bash scripts/test-convert-outputs.sh --update
          python3 scripts/build-catalog.py
      - name: Emit content-addressed generated artifact IDs
        run: |
          echo "SYNC_MANIFEST_BLOB_SHA=$(git hash-object -w scripts/convert-outputs.sha256)"
          echo "SYNC_CATALOG_BLOB_SHA=$(git hash-object -w CATALOG.md)"
          wc -l scripts/convert-outputs.sha256 CATALOG.md

      - name: Export validated manifest in chunks for GitHub API import
        run: |
          python3 -c 'import base64,pathlib; b=base64.b64encode(pathlib.Path("scripts/convert-outputs.sha256").read_bytes()).decode("ascii"); print(*("SYNC_B64_PART="+b[i:i+700] for i in range(0,len(b),700)),sep=chr(10))'
