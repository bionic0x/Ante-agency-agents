name: Bootstrap mispriced-cmo branch

on:
  push:
    branches:
      - feat/mispriced-cmo-division

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify canonical payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git hash-object .bootstrap/mispriced-cmo/patch.bz2.b64.02)" = "176049871db50a9a7008ad3a35807b93de0711b2"
          test "$(git hash-object .bootstrap/mispriced-cmo/patch.bz2.b64.04)" = "78e6a1ddd27146436a131739e25243463e4a055e"
          test "$(git hash-object .bootstrap/repair06/part00)" = "0125fc3212457d5d96690783efffc129d9995e50"
          test "$(git hash-object .bootstrap/repair06/part01)" = "96d43670abea953e06822d6b9de1e5da6e7483c8"
          test "$(git hash-object .bootstrap/repair06/part02)" = "6c998bf2c0632cb547968e0120e7767413751a4e"
          test "$(git hash-object .bootstrap/repair06/part03)" = "8576e6ccf7d498b642b9e17121cf87f7b5be0f50"

          cat .bootstrap/repair06/part0{0,1,2,3} > .bootstrap/mispriced-cmo/patch.bz2.b64.06
          test "$(wc -c < .bootstrap/mispriced-cmo/patch.bz2.b64.06)" -eq 20000
          test "$(git hash-object .bootstrap/mispriced-cmo/patch.bz2.b64.06)" = "7b2670b9f8d0fb6b4501024b430d508ccb641a72"

          git add .bootstrap/mispriced-cmo/patch.bz2.b64.06
          git commit -m "fix: restore verified bootstrap chunk 06"

          cat .bootstrap/mispriced-cmo/patch.bz2.b64.0[0-7] > /tmp/patch.b64
          base64 --decode /tmp/patch.b64 > /tmp/patch.bz2
          echo "6ff27affba0037405572935ca1514d9febe826c83402cc7da662f93bee4ada20  /tmp/patch.bz2" | sha256sum -c -
          bzip2 -t /tmp/patch.bz2
          bzip2 -dc /tmp/patch.bz2 > /tmp/mispriced-cmo.patch
          echo "ab8dbf422aeb374b45dad778685c67626394ed9800397bb81fa211cd7fc5fa04  /tmp/mispriced-cmo.patch" | sha256sum -c -
          git apply --check /tmp/mispriced-cmo.patch

      - name: Apply source patch preserving commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git am /tmp/mispriced-cmo.patch

      - name: Remove bootstrap material and publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap
          git rm .github/workflows/bootstrap-mispriced-cmo.yml
          git commit -m "chore: remove mispriced-cmo bootstrap material"
          git push origin HEAD:feat/mispriced-cmo-division
