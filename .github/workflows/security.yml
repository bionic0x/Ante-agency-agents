name: Security scans

# Secret scanning, workflow linting, static analysis and known-vulnerability checks.
# Every tool is pinned: Python tools by hash (.github/requirements/*.txt), binaries by
# release checksum below. The weekly run catches new advisories and rules on quiet weeks.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  secrets:
    name: secrets in the full git history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan every commit
        # Allowlists live in .gitleaks.toml and are narrow by design; findings are redacted.
        run: ./gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  workflows:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install --require-hashes --no-deps -r .github/requirements/zizmor.txt
      - name: Audit workflows (template injection, unpinned actions, credential persistence, ...)
        run: zizmor --offline --format github .github/workflows

  sast:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements/semgrep.txt
      - run: python3 -m pip install --require-hashes --no-deps -r .github/requirements/semgrep.txt
      - name: Scan (Python, security audit, secrets, GitHub Actions)
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        # Suppressions are inline `nosemgrep: <rule> -- reason` comments, each justified.
        run: >
          semgrep scan --metrics=off --error --disable-version-check
          --config p/python --config p/security-audit --config p/secrets --config p/github-actions .

  dependencies:
    name: known vulnerabilities in pinned dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Scan lock files
        run: |
          ./osv-scanner scan source \
            --lockfile requirements.txt:.github/requirements/validation.txt \
            --lockfile requirements.txt:.github/requirements/zizmor.txt \
            --lockfile requirements.txt:.github/requirements/semgrep.txt \
            --lockfile requirements.txt:relay/tests/requirements-property.txt
